<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
  }
  .calculator {
    background: #212121;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: 340px;
  }
  #display {
    width: 100%;
    height: 70px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 10px;
    text-align: right;
    font-size: 28px;
    padding: 10px 15px;
    margin-bottom: 15px;
    outline: none;
    overflow-x: auto;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  button {
    padding: 16px 0;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #3a3a3a;
    color: #fff;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover {
    background: #4d4d4d;
  }
  button:active {
    transform: scale(0.95);
  }
  .operator {
    background: #ff9500;
  }
  .operator:hover {
    background: #ffab33;
  }
  .function {
    background: #565656;
  }
  .equals {
    background: #ff9500;
    grid-column: span 2;
  }
  .clear, .delete {
    background: #a83232;
  }
  .clear:hover, .delete:hover {
    background: #c94040;
  }
  .zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" disabled>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">AC</button>
    <button class="delete" onclick="deleteLast()">DEL</button>
    <button class="function" onclick="appendValue('(')">(</button>
    <button class="function" onclick="appendValue(')')">)</button>
    <button class="operator" onclick="appendValue('/')">÷</button>

    <button class="function" onclick="appendValue('sin(')">sin</button>
    <button class="function" onclick="appendValue('cos(')">cos</button>
    <button class="function" onclick="appendValue('tan(')">tan</button>
    <button class="function" onclick="appendValue('log(')">log</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="function" onclick="appendValue('sqrt(')">√</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="function" onclick="appendValue('^')">xʸ</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="function" onclick="appendValue('!')">n!</button>
    <button class="equals" onclick="calculate()" rowspan="2">=</button>

    <button class="zero" onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="function" onclick="appendValue('pi')">π</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  let expression = '';

  function appendValue(value) {
    expression += value;
    display.value = expression;
  }

  function clearDisplay() {
    expression = '';
    display.value = '';
  }

  function deleteLast() {
    expression = expression.slice(0, -1);
    display.value = expression;
  }

  // Factorial helper
  function factorial(n) {
    if (n < 0) return NaN;
    if (n === 0 || n === 1) return 1;
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    return result;
  }

  function calculate() {
    try {
      let expr = expression;

      // Replace friendly symbols with JS Math equivalents
      expr = expr.replace(/\^/g, '**');
      expr = expr.replace(/pi/g, 'Math.PI');
      expr = expr.replace(/sqrt\(/g, 'Math.sqrt(');
      expr = expr.replace(/sin\(/g, 'Math.sin(');
      expr = expr.replace(/cos\(/g, 'Math.cos(');
      expr = expr.replace(/tan\(/g, 'Math.tan(');
      expr = expr.replace(/log\(/g, 'Math.log10(');

      // Handle factorial: number followed by !
      expr = expr.replace(/(\d+(\.\d+)?)!/g, function(match, num) {
        return factorial(parseFloat(num));
      });

      // Evaluate safely-ish (basic calculator, not user-facing security context)
      let result = Function('"use strict"; return (' + expr + ')')();

      display.value = result;
      expression = result.toString();
    } catch (error) {
      display.value = 'Error';
      expression = '';
    }
  }

  // Allow keyboard input
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') appendValue(e.key);
    else if (['+','-','*','/','(',')','.'].includes(e.key)) appendValue(e.key);
    else if (e.key === 'Enter') { e.preventDefault(); calculate(); }
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearDisplay();
  });
</script>

</body>
</html>
