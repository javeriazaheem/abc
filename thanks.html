<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Javeria Zaheem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (!stored && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
<header>
  <nav aria-label="Main navigation">
    <div class="logo"><span class="logo-dot"></span>Javeria Zaheem</div>
    <div class="nav-right">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">🌙</button>
    </div>
  </nav>
</header>

<main>
  <section class="thanks-wrap">
    <div class="thanks-card fade-up">
      <div class="thanks-check" aria-hidden="true">✓</div>
      <span class="eyebrow">Message sent</span>
      <h1>Thank <span class="accent">you!</span></h1>
      <p class="thanks-text">Your message reached my inbox. I'll get back to you as soon as I can.</p>
      <p class="thanks-count">Taking you back to the homepage in <strong id="countdown">7</strong>s…</p>
      <a href="index.html" class="btn btn-solid">Take me back now</a>
    </div>
  </section>
</main>

<script src="script.js" defer></script>
<script>
  var seconds = 7;
  var countdownEl = document.getElementById('countdown');

  // setInterval: updates the number every second
  var timer = setInterval(function () {
    seconds--;
    countdownEl.textContent = seconds;
    if (seconds <= 0) clearInterval(timer);
  }, 1000);

  // setTimeout: redirects once, after 7 seconds
  setTimeout(function () {
    window.location.href = 'index.html';
  }, 7000);
</script>
</body>
</html>
